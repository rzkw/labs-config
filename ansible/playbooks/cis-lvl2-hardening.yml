---
- name: CIS macOS 15.0 Level 2 hardening (headless VM)
  hosts: cis_lvl2
  gather_facts: false
  vars:
    mscp_script_src: "{{ playbook_dir }}/../../plans/sequoia-hardening/guidance_l2/cis_lvl2_macos_15.0_compliance.sh"
    mscp_script_dest: /usr/local/bin/cis_lvl2_macos_15.0_compliance.sh
    mscp_baseline: org.cis_lvl2_macos_15.0.audit
    mscp_exempt_reason: "Not applied: SSH retained; password policy excluded per headless VM policy"
    exempted_rules:
      - system_settings_ssh_disable
      - pwpolicy_account_lockout_enforce
      - pwpolicy_account_lockout_timeout_enforce
      - pwpolicy_alpha_numeric_enforce
      - pwpolicy_custom_regex_enforce
      - pwpolicy_history_enforce
      - pwpolicy_max_lifetime_enforce
      - pwpolicy_minimum_length_enforce
      - pwpolicy_special_character_enforce

  tasks:
    - name: Deploy NIST mSCP compliance script
      ansible.builtin.copy:
        src: "{{ mscp_script_src }}"
        dest: "{{ mscp_script_dest }}"
        mode: "0755"
        remote_src: false
      become: true

    - name: Scan compliance (check)
      ansible.builtin.command: "{{ mscp_script_dest }} --check"
      become: true
      register: mscp_check
      changed_when: false
      failed_when: false

    # mSCP's scan rewrites each rule dict and drops pre-seeded exemption keys.
    # Re-seed AFTER the scan so run_fix honors them for SSH + password policy.
    - name: Pre-seed exemptions (SSH kept, password policy excluded)
      ansible.builtin.command:
        argv:
          - /usr/bin/defaults
          - write
          - "{{ mscp_baseline }}"
          - "{{ item }}"
          - -dict-add
          - exempt
          - "1"
          - exempt_reason
          - "{{ mscp_exempt_reason }}"
      become: true
      loop: "{{ exempted_rules }}"
      changed_when: true

    - name: Remediate non-compliant settings (fix)
      ansible.builtin.command: "{{ mscp_script_dest }} --fix"
      become: true
      register: mscp_fix
      changed_when: true
      failed_when: false

    - name: Scan compliance again (verify)
      ansible.builtin.command: "{{ mscp_script_dest }} --check"
      become: true
      register: mscp_verify
      changed_when: false
      failed_when: false

    # Hard guarantee: re-enable Remote Login + sshd regardless of remediation.
    - name: Enable Remote Login
      ansible.builtin.command: /usr/sbin/systemsetup -f -setremotelogin on
      become: true
      changed_when: true

    - name: Enable sshd launchd job
      ansible.builtin.command: /bin/launchctl enable system/com.openssh.sshd
      become: true
      changed_when: true

    - name: Start sshd launchd job
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - bootstrap
          - system
          - /System/Library/LaunchDaemons/ssh.plist
      become: true
      changed_when: true
      failed_when: false

    - name: Assert SSH is enabled and Remote Login is on
      ansible.builtin.command: /bin/launchctl print-disabled system
      register: ssh_state
      changed_when: false
      failed_when: "'\"com.openssh.sshd\" => disabled' in ssh_state.stdout"

    - name: Show non-compliant rules
      ansible.builtin.command: "{{ mscp_script_dest }} --non-compliant"
      register: mscp_noncompliant
      changed_when: false
      failed_when: false

    - name: Show compliance stats
      ansible.builtin.command: "{{ mscp_script_dest }} --stats"
      register: mscp_stats
      changed_when: false
      failed_when: false

    - name: Report results
      ansible.builtin.debug:
        msg:
          - "Remediation run (truncated): {{ (mscp_fix.stdout_lines | default([]))[-3:] }}"
          - "Non-compliant rules: {{ mscp_noncompliant.stdout | default('(none output)') }}"
          - "Stats: {{ mscp_stats.stdout | default('(none output)') }}"
          - "SSH re-enabled (Remote Login on, sshd enabled)."
